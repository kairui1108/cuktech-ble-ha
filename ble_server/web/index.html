    <!--
      外观引导（必须在样式表之前执行）
      深浅两套调色板都在 index.css 里，这里只负责尽早给 <html> 打上 data-appearance，
      避免"浅色系统 + 已保存浅色主题"时首屏闪一下深色。
      同时把历史遗留的主题名（deep-blue/ocean/gray）迁移成 system。
    -->
    <script>
    (function () {
        var saved = null;
        try { saved = localStorage.getItem('cuktech-theme'); } catch (e) {}
        if (saved !== 'light' && saved !== 'ha-dark' && saved !== 'system') {
            saved = 'system';
            try { localStorage.setItem('cuktech-theme', 'system'); } catch (e) {}
        }
        var prefersDark = true;
        try {
            prefersDark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        document.documentElement.setAttribute(
            'data-appearance',
            saved === 'light' ? 'light' : (saved === 'ha-dark' ? 'dark' : (prefersDark ? 'dark' : 'light'))
        );
    })();
    </script>

<script>
// 设备设置浮层：配置行平时不占右栏高度，点"设置"弹出
(function () {
    var modal = document.getElementById('settingsModal');
    if (!modal) return;
    function open() { modal.classList.add('is-open'); }
    function close() { modal.classList.remove('is-open'); }
    window.openSettingsModal = open;
    window.closeSettingsModal = close;
    modal.addEventListener('click', function (e) { if (e.target === modal) close(); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) close();
    });
})();
</script>

<script>

(function () {

    var ticking = false;
    function sync() {
        bar.classList.toggle('is-scrolled', window.scrollY > 6);
        ticking = false;
    }
    window.addEventListener('scroll', function () {
        if (!ticking) { ticking = true; window.requestAnimationFrame(sync); }
    }, { passive: true });
    sync();
})();
</script>

<script>
/*
 * 端口卡组（堆叠卡）：限额与倒计时各自一沓。
 *
 * 为什么桌面端也要堆叠：四个端口的限额/倒计时是同构表单，平铺会把侧栏拉得极长，
 * 而"一次只调一个口"才是真实用法。这里沿用 phone.html 的限额卡组交互
 * （--depth 逐层下移 + 收窄、翻页/指示点），只是把渲染留给了 app.js /
 * charge_limit.js——所以用 MutationObserver 在它们重建 DOM 后重新铺一次。
 *
 * 指示点同时兼作状态灯（米家的编码方式，不靠颜色也能分辨）：
 *   空心 = 该口未设置；实心（端口色）= 已设置；实心警示色 = 限额已触发关断；
 *   当前项拉长成胶囊 = 现在看的是这个口。
 *
 * 手势阈值直接复用 charge_limit.js 的 swipeDecision（手机端同一套判定）。
 */
(function () {
    var PEEK = 11;          // 每层露出的底边高度（px）：太小就看不出一沓卡的感觉
    var NARROW = 9;         // 每层收窄（px）
    var FLY_MS = 300;       // 翻出去的时长，要和 CSS 的 --dur-slow 对齐
    var DOT_POLL_MS = 2000; // 状态灯轮询：限额每 5s 刷新、倒计时随 SSE 变，都不改子节点

    function portKeyOf(el) {
        var p = el.querySelector('.countdown-port');
        if (!p) return '';
        var keys = ['c1', 'c2', 'c3', 'a'];
        for (var i = 0; i < keys.length; i++) {
            if (p.classList.contains(keys[i])) return keys[i];
        }
        return '';
    }

    // 0 = 未设置 / 1 = 已设置 / 2 = 已触发关断
    function dotState(el, kind) {
        var key = portKeyOf(el);
        if (!key) return 0;
        if (kind === 'limit') {
            if (typeof ChargeLimit === 'undefined' || !ChargeLimit.entryFor) return 0;
            var e = ChargeLimit.entryFor(key);
            if (e && e.fired) return 2;
            return (e && e.wh > 0) ? 1 : 0;
        }
        // 倒计时没有独立的全局状态，卡片右上角那行状态文字就是当前值（未设置时是
        // i18n 的 notSet 文案）。用同一个 i18n 运行时取文案来比对，切语言不会误判。
        // i18n 运行时缺失时直接视为未设置：页面本来就没法正常渲染，不该依赖硬编码文案。
        var st = el.querySelector('.countdown-current');
        if (!st || typeof I18N === 'undefined' || !I18N.t) return 0;
        return String(st.textContent).trim() === String(I18N.t('common.notSet')).trim() ? 0 : 1;
    }

    function initDeck(gridId, kind) {
        var grid = document.getElementById(gridId);
        if (!grid) return;
        var host = grid.closest('.card') || grid.parentNode;
        var dots = host.querySelector('.deck-dots[data-deck="' + gridId + '"]');
        if (!dots) {
            dots = document.createElement('div');
            dots.className = 'deck-dots';
            dots.setAttribute('data-deck', gridId);
            host.appendChild(dots);
        }

        var index = 0;
        var drag = null;
        var suppressClick = false;

        function cards() {
            var out = [];
            for (var i = 0; i < grid.children.length; i++) {
                var el = grid.children[i];
                if (el.nodeType === 1 && !el.classList.contains('empty-state')) out.push(el);
            }
            return out;
        }

        // 指示点：只在数量或 class 变化时写 DOM（否则每 2s 重建会打断 hover/点击）
        function syncDots(list) {
            var n = list.length;
            if (dots.children.length !== n) {
                var html = '';
                for (var k = 0; k < n; k++) {
                    html += '<button type="button" class="deck-dot" data-i="' + k + '"></button>';
                }
                dots.innerHTML = html;
            }
            for (var k = 0; k < n; k++) {
                var b = dots.children[k];
                var key = portKeyOf(list[k]);
                var st = dotState(list[k], kind);
                var cls = 'deck-dot' + (key ? ' ' + key : '') + (k === index ? ' is-current' : '');
                if (st === 1) cls += ' is-set';
                if (st === 2) cls += ' is-fired';
                if (b.className !== cls) b.className = cls;
                b.setAttribute('aria-label', (key ? key.toUpperCase() + ' · ' : '') + (k + 1) + '/' + n);
                b.setAttribute('aria-current', k === index ? 'true' : 'false');
            }
        }

        function paint() {
            var list = cards();
            var n = list.length;
            if (!n) {
                grid.classList.remove('deck');
                grid.style.paddingBottom = '';
                dots.innerHTML = '';
                return;
            }
            if (index >= n) index = index % n;
            if (index < 0) index = n - 1;

            grid.classList.add('deck');
            grid.style.setProperty('--deck-peek', PEEK + 'px');
            grid.style.setProperty('--deck-narrow', NARROW + 'px');
            // 给下层露出的边缘留出空间，+6 是余量（不然最深那张的底边会被裁掉）
            grid.style.paddingBottom = ((n - 1) * PEEK + 6) + 'px';

            for (var i = 0; i < n; i++) {
                var el = list[i];
                var depth = (i - index + n) % n;
                el.style.setProperty('--depth', String(depth));
                el.style.zIndex = String(20 - depth);
                el.classList.toggle('is-top', depth === 0);
                // 静止的卡一律只由 CSS（--depth）定位：清掉跟手/飞出时留下的内联值，
                // 否则被打断的那张会停在容器外被裁掉，看起来就是"牌堆塌了"
                if (!(drag && drag.el === el)) {
                    el.style.transform = '';
                    el.style.opacity = '';
                }
                // 下层卡只露一条边，键盘/读屏不该停在看不见的控件上
                if ('inert' in el) el.inert = depth !== 0;
            }
            syncDots(list);
        }

        // 把栈顶那张朝 dir 方向推出去，动画结束后再无声地归位到栈底。
        // 归位必须关掉过渡：不然它会"从屏幕外滑回牌堆"，比不做动画更费解。
        function flyOut(el, dir) {
            var w = el.offsetWidth || 320;
            el.style.transition = 'transform ' + FLY_MS + 'ms cubic-bezier(0.22, 0.61, 0.36, 1), opacity ' + FLY_MS + 'ms';
            el.style.transform = 'translate(' + (dir * (w + 48)) + 'px, 0)';
            el.style.opacity = '0';
            setTimeout(function () {
                // 归位永远要执行；万一用户此刻正拖着这张，就按当前拖拽量还原，
                // 而不是跳过（跳过会让它带着飞出位移留在容器外，等于凭空少一张卡）
                var dragging = drag && drag.el === el && drag.moved;
                el.style.transition = 'none';
                el.style.transform = dragging ? 'translate(' + drag.dx + 'px, 0)' : '';
                el.style.opacity = dragging ? String(Math.max(0.35, 1 - Math.abs(drag.dx) / 420)) : '';
                void el.offsetWidth;                  // 强制回流，让归位不进过渡
                el.style.transition = '';
            }, FLY_MS + 20);
        }

        // 唯一的翻页入口：指示点、点击露出的边、手势都走这里，保证栈序与动画一致
        function goTo(next, flyDir) {
            var list = cards();
            var n = list.length;
            if (!n) return;
            next = ((next % n) + n) % n;
            if (next === index) return;
            var old = list[index];
            var outX = (flyDir === 1 || flyDir === -1) ? flyDir : (next > index ? -1 : 1);
            index = next;
            paint();
            if (old && old !== list[index]) flyOut(old, outX);
        }

        dots.addEventListener('click', function (e) {
            var b = e.target && e.target.closest ? e.target.closest('.deck-dot') : null;
            if (!b) return;
            var i = parseInt(b.getAttribute('data-i'), 10);
            if (isNaN(i)) return;
            goTo(i);
        });

        // 点露出的那条边 = 把它翻上来（支持 inert 的浏览器里下层收不到指针事件，
        // 那里就靠拖拽和指示点，与 phone.html 一致）
        grid.addEventListener('click', function (e) {
            if (suppressClick) {
                suppressClick = false;
                e.stopPropagation();
                if (e.preventDefault) e.preventDefault();
                return;
            }
            var el = e.target && e.target.closest
                ? e.target.closest('.charge-limit-item, .countdown-item') : null;
            if (!el || el.classList.contains('is-top')) return;
            var i = cards().indexOf(el);
            if (i < 0) return;
            e.stopPropagation();
            goTo(i);
        }, true);

        grid.addEventListener('pointerdown', function (e) {
            if (!grid.classList.contains('deck')) return;
            var tag = e.target && e.target.tagName ? String(e.target.tagName).toUpperCase() : '';
            if (tag === 'INPUT' || tag === 'SELECT' || tag === 'OPTION') return;
            drag = { id: e.pointerId, x: e.clientX, y: e.clientY, dx: 0, moved: false, el: cards()[index] || null };
        });

        grid.addEventListener('pointermove', function (e) {
            if (!drag || e.pointerId !== drag.id || !drag.el) return;
            var dx = e.clientX - drag.x;
            var dy = e.clientY - drag.y;
            if (!drag.moved) {
                if (Math.abs(dx) < 8) return;
                // 纵向为主的手势交还页面滚动
                if (Math.abs(dx) <= Math.abs(dy)) { drag = null; return; }
                drag.moved = true;
                drag.el.style.transition = 'none';
                try { grid.setPointerCapture(e.pointerId); } catch (err) { /* 指针已失效，忽略 */ }
            }
            drag.dx = dx;
            drag.el.style.transform =
                'translate(' + dx + 'px, calc(var(--depth, 0) * var(--deck-peek, 11px)))';
            drag.el.style.opacity = String(Math.max(0.35, 1 - Math.abs(dx) / 420));
        });

        function endDrag(e) {
            var d = drag;
            if (!d || e.pointerId !== d.id) return;
            drag = null;
            if (!d.moved || !d.el) return;   // 只是点了下按钮，交给原生 click
            suppressClick = true;
            setTimeout(function () { suppressClick = false; }, 400);
            var el = d.el;
            // 跟手期间写的是内联 transform，必须交还给 CSS（位置由 --depth 决定）：
            // 否则这张卡会带着横移量留在原地，看起来就是"歪在半路 + 内容被裁"
            el.style.transition = '';
            el.style.opacity = '';
            el.style.transform = '';
            var dir = (e.type === 'pointercancel' || typeof ChargeLimit === 'undefined')
                ? 0
                : ChargeLimit.swipeDecision(d.dx, el.offsetWidth || 320);
            if (dir) goTo(index + dir, -dir);   // 往划走的方向飞出去
            else paint();                       // 没过阈值：由 CSS 过渡带回栈顶
        }
        grid.addEventListener('pointerup', endDrag);
        grid.addEventListener('pointercancel', endDrag);

        // app.js / charge_limit.js 会整段重建 innerHTML（首次渲染、切语言、轮询），
        // 重建后必须重新铺栈序
        var mo = new MutationObserver(function () { setTimeout(paint, 0); });
        mo.observe(grid, { childList: true });

        setInterval(function () { syncDots(cards()); }, DOT_POLL_MS);
        paint();
    }

    initDeck('chargeLimitGrid', 'limit');
    initDeck('countdownGrid', 'countdown');
})();

/*
 * 会话详情浮层。
 * charge_history.js 只切 #sessionDetail 的 style.display，样式由 CSS 决定；
 * 这里把 display 的变化同步成一个类。为什么不做内联展开：会话详情比其余卡片高
 * 300px 以上，展开会把主列顶长、右栏底下空出一大块，整页就不齐了。
 */
(function () {
    var detail = document.getElementById('sessionDetail');
    if (!detail) return;

    function sync() {
        var open = detail.style.display !== 'none';
        if (open === detail.classList.contains('is-open')) return;
        detail.classList.toggle('is-open', open);
        if (open) {
            // 图表是在浮层可见之前创建的，可能按 0 尺寸量过一遍：下一帧请它重新量
            window.requestAnimationFrame(function () {
                window.dispatchEvent(new Event('resize'));
            });
        }
    }
    new MutationObserver(sync).observe(detail, { attributes: true, attributeFilter: ['style'] });
    sync();

    var close = function () {
        if (typeof closeSessionDetail === 'function') closeSessionDetail();
    };
    detail.addEventListener('click', function (e) { if (e.target === detail) close(); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && detail.classList.contains('is-open')) close();
    });
})();

</script>

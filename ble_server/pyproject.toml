[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuktech-ble-server"
version = "2.0.0-Beta"
description = "CUKTECH 10 GaN Charger BLE Server for Home Assistant"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "paho-mqtt>=2.0",
    "bleak>=0.21",
    "cryptography>=41",
    "pyyaml>=6.0",
    "requests>=2.31",
    "pycryptodomex>=3.20",   # 导入名是 Cryptodome（不是 Crypto）
]

# 测试依赖也归自己声明：下面的 `asyncio_mode = "auto"` 硬性要求 pytest-asyncio，
# 靠"CI 里别人的 dev extra 顺带装过"是一条没写出来的跨步骤依赖。
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning:aiohttp"]

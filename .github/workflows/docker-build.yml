name: CI / CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 两个测试 job 只需要读代码；只有构建 job 需要 packages: write（见该 job）。
permissions:
  contents: read

# 连续 push 到同一分支时，旧运行已经没有意义。但 **tag 构建不许取消**：它正在往
# GHCR/Docker Hub 推多架构镜像（manifest list 最后才写），取消会留下"某架构已推、
# manifest 缺失"的状态，而且结果是 cancelled 而不是红色——最容易被当成"没跑过"。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: kairui1108/cuktech-ble-server
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE: kairui1108/cuktech-ble-server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 每次全量从 PyPI 拉 bleak/cryptography/aiohttp/paho-mqtt：不缓存时这一步
          # 偶发慢/5xx 就会吃满上面的超时上限，而报错长得像"跟代码无关的 flaky"。
          cache: pip
          cache-dependency-path: |
            ble_server/pyproject.toml
            ha_integration/pyproject.toml

      - name: Install Python dependencies
        working-directory: ./ble_server
        run: |
          pip install --upgrade pip
          # 从 pyproject 装（含 requests / pycryptodomex）：手抄一份包清单迟早和声明漂移，
          # 而漂移的表现是"本地全绿、CI 报 ModuleNotFoundError"。
          pip install -e ".[dev]"
          # 引号必加：`../ha_integration[dev]` 不加引号会被 bash 当路径通配展开。
          pip install -e "../ha_integration[dev]"

      # 镜像不是 pip 装的，是按 Dockerfile 的 COPY 清单拼出来的（`COPY *.py ./`）。
      # 缺文件/多余文件这一步在源码树上永远看不出来：多设备改造漏掉
      # adapter_coordinator.py 时，测试全绿而镜像一启动就 ModuleNotFoundError。
      # 这里把那份文件集合原样拼到临时目录，真跑一次 import（不需要 docker）。
      - name: Smoke-test the image file set
        working-directory: ./ble_server
        run: |
          set -e
          rm -rf /tmp/imgfs && mkdir -p /tmp/imgfs
          cp -r src /tmp/imgfs/
          cp -r web /tmp/imgfs/
          cp pyproject.toml /tmp/imgfs/
          cp *.py /tmp/imgfs/                     # 与 Dockerfile 的 COPY *.py 同源
          cp config.yaml.example /tmp/imgfs/config.yaml
          cd /tmp/imgfs && python -c "import ha_server; print('image file set imports ok')"

      - name: Run unit tests
        working-directory: ./ble_server
        run: python -m pytest tests/ -v --tb=short

      - name: Run HA integration tests
        working-directory: ./ha_integration
        run: python -m pytest tests/ -v --tb=short

  js:
    name: JS contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (i18n 校验脚本用)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run JS suites
        working-directory: ./ble_server
        run: |
          # web/*.js 与 config.html 的内联脚本没有构建步骤，唯一的安全网就是这批
          # node 契约测试（800+ 断言）。不跑它们 = 前端改动在 PR 里无人验证。
          set -e
          # 少跑几个套件和"全绿"在日志里长得一模一样，所以逐个点名核对：
          # 改名 / 挪目录 / 漏提交都会直接指出是哪一个文件不见了。
          for required in charge_limit_test.js charge_limit_contrast_test.js \
              charge_limit_deck_test.js config_devices_test.js device_bench_test.js \
              device_store_test.js i18n_runtime_test.js index_light_contrast_test.js \
              port_modes_test.js smoke_test.js syntax_test.js; do
            [ -f "tests/js/$required" ] || { echo "缺少套件 tests/js/$required"; exit 1; }
          done
          for f in tests/js/*_test.js; do
            echo "== $f"
            node "$f"
          done

      - name: Verify i18n packs
        working-directory: ./ble_server
        run: python tests/js/verify_i18n.py

  build-and-push:
    name: Build and Push Docker Image
    # js 必须进来：镜像里带着 web/，前端回归全红却照样发布 = 让用户去发现白屏。
    needs: [test, js]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # :latest 只由"正式版 tag"更新。以前是 raw 无条件写，于是从任意
            # 分支手动 dispatch 一次（或推一个 v2.0.0-Beta 预发布 tag）就会把
            # :latest 覆盖成那个构建——拉 :latest 的人拿到的是未验证的版本。
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./ble_server
          file: ./ble_server/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image info
        run: |
          echo "ghcr.io: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}"
          echo "Docker Hub: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

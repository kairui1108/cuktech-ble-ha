name: CI / CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: kairui1108/cuktech-ble-server
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE: kairui1108/cuktech-ble-server

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        working-directory: ./ble_server
        run: |
          pip install --upgrade pip
          # 从 pyproject 装（含 requests / pycryptodomex）：手抄一份包清单迟早和声明漂移，
          # 而漂移的表现是"本地全绿、CI 报 ModuleNotFoundError"。
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Run unit tests
        working-directory: ./ble_server
        run: python -m pytest tests/ -v --tb=short

      - name: Run HA integration tests
        working-directory: ./ha_integration
        run: python -m pytest tests/ -v --tb=short

  js:
    name: JS contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python (i18n 校验脚本用)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run JS suites
        working-directory: ./ble_server
        run: |
          # web/*.js 与 config.html 的内联脚本没有构建步骤，唯一的安全网就是这批
          # node 契约测试（800+ 断言）。不跑它们 = 前端改动在 PR 里无人验证。
          set -e
          for f in tests/js/*_test.js; do
            echo "== $f"
            node "$f"
          done

      - name: Verify i18n packs
        working-directory: ./ble_server
        run: python tests/js/verify_i18n.py

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./ble_server
          file: ./ble_server/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image info
        run: |
          echo "ghcr.io: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE }}"
          echo "Docker Hub: ${{ env.DOCKERHUB_REGISTRY }}/${{ env.DOCKERHUB_IMAGE }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
